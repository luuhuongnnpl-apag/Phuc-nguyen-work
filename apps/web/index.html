<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b2a">
  <meta name="description" content="Phúc Nguyên Work - Không gian quản lý lịch và công việc chuyên môn">
  <title>WORK'S CORNER | PHÚC NGUYÊN WORK</title>
  <link rel="icon" href="./logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="./styles.css?v=20261102d">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <img class="logo" src="./logo.png" alt="Phúc Nguyên Library — Research Law for Better Life">
      <h1 class="title">WORK’S CORNER</h1>
    </header>

    <div class="workspace">
      <nav class="sidebar" id="navigation" aria-label="Phân hệ công việc">
        <button class="pill nav-item active" data-view="teaching">LỊCH GIẢNG</button>
        <button class="pill nav-item" data-view="meetings">LỊCH HỌP</button>
        <button class="pill nav-item" data-view="study">LỊCH HỌC</button>
        <button class="pill nav-item" data-view="invigilation">COI THI</button>
        <button class="pill nav-item" data-view="grading">CHẤM THI</button>
        <button class="pill nav-item" data-view="research">NCKH</button>
        <button class="pill nav-item" data-view="other">KHÁC</button>
        <button class="pill nav-item" data-view="rmia">LỊCH R'MIA</button>
      </nav>

      <main class="main">
        <div class="section-pill pill" id="sectionTitle">LỊCH GIẢNG</div>

        <div id="weekPanel" class="panel">
        <div class="table-wrap">
          <table class="week-table" aria-describedby="weekCaption">
            <caption id="weekCaption" class="sr-only">Lịch theo tuần</caption>
            <thead>
              <tr>
                <th class="dh">THỨ HAI</th><th class="dh">THỨ 3</th><th class="dh">THỨ 4</th><th class="dh">THỨ 5</th><th class="dh">THỨ 6</th><th class="dh">THỨ 7</th><th class="dh">CHỦ NHẬT</th>
              </tr>
            </thead>
            <tbody id="weekBody"></tbody>
          </table>
        </div>

        <ul class="week-list" id="weekList" aria-label="Các tuần đã ban hành"></ul>
        </div>

        <div id="ttPanel" class="panel" hidden>
          <div class="class-switch" id="classSwitch" role="tablist" aria-label="Chọn lớp"></div>
          <p class="tt-note" id="ttNote"></p>
          <div class="table-wrap"><table class="tt-table" id="ttTable"></table></div>
          <ul class="tt-notes" id="ttNotes"></ul>
        </div>
      </main>
    </div>
  </div>

  <script src="./data.js?v=20261102d"></script>
  <script src="./rmia.js?v=20261102d"></script>
  <script src="./app.js?v=20261102d"></script>
</body>
</html>
