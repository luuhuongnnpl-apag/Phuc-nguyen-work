<div class="pn-history-nav" role="toolbar" aria-label="Điều hướng trang"><span class="pn-history-label">ĐIỀU HƯỚNG</span><span class="pn-history-spacer"></span><button type="button" data-history-back aria-label="Quay lại" title="Quay lại" disabled>‹</button><button type="button" data-history-forward aria-label="Tiến tới" title="Tiến tới" disabled>›</button></div>

    <div class="workspace workspace-single">


      <main class="frame main">
        <h2 class="ftitle" id="sectionTitle">LỊCH GIẢNG</h2>

        <div id="weekPanel" class="panel">
        <div class="table-wrap">
          <table class="week-table" aria-describedby="weekCaption">
            <caption id="weekCaption" class="sr-only">Lịch theo tuần</caption>
            <thead>
              <tr>
                <th class="session-head">BUỔI</th><th class="dh">THỨ HAI</th><th class="dh">THỨ 3</th><th class="dh">THỨ 4</th><th class="dh">THỨ 5</th><th class="dh">THỨ 6</th><th class="dh">THỨ 7</th><th class="dh">CHỦ NHẬT</th>
              </tr>
            </thead>
            <tbody id="weekBody"></tbody>
          </table>
        </div>

        <ul class="week-list" id="weekList" aria-label="Các tuần đã ban hành"></ul>
        </div>

        <div id="ttPanel" class="panel" hidden>
          <div class="class-switch" id="classSwitch" role="tablist" aria-label="Chọn lớp"></div>
          <p class="tt-note" id="ttNote"></p>
          <div class="table-wrap"><table class="tt-table" id="ttTable"></table></div>
          <ul class="tt-notes" id="ttNotes"></ul>
        </div>
      </main>
