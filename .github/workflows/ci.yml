name: Validate repository
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s README.md
          test -s apps/web/index.html
          test -s apps/web/app.js
          test -s apps/web/work.css
          test -s apps/web/data/events.json
      - name: Validate JavaScript and data
        run: |
          node --check apps/web/app.js
          node --check apps/web/config.js
          node --check apps/web/rmia.js
          node --check apps/web/history-nav.js
          node -e "const d=JSON.parse(require('fs').readFileSync('apps/web/data/events.json','utf8'));const ids=new Set();for(const e of d.events){if(!e.id||!e.title||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))throw new Error('Mục lỗi: '+JSON.stringify(e));if(ids.has(e.id))throw new Error('Trùng id: '+e.id);ids.add(e.id)}console.log(d.events.length+' mục hợp lệ')"
