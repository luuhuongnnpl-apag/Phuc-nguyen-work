name: Deploy PHÚC NGUYÊN WORK to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web entry point
        run: |
          test -s apps/web/index.html && test -s apps/web/app.js && test -s apps/web/styles.css && test -s apps/web/work.css
          node --check apps/web/app.js && node --check apps/web/config.js && node --check apps/web/rmia.js
          node -e "const d=JSON.parse(require('fs').readFileSync('apps/web/data/events.json','utf8'));if(!Array.isArray(d.events)||!Array.isArray(d.categories))process.exit(1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
