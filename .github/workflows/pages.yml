name: Deploy PHÚC NGUYÊN WORK to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web entry point
        run: test -s apps/web/index.html && test -s apps/web/app.js && test -s apps/web/styles.css && test -s apps/web/manage.html && test -s apps/web/manage.js && test -s apps/web/manage.css && test -s apps/web/planner.html && test -s apps/web/planner.css && test -s apps/web/planner.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
